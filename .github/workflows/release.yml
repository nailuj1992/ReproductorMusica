name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compute version (strip leading 'v' from tag)
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build JAR
        run: mvn -B clean package

      - name: Collect dependencies + main JAR
        shell: bash
        run: |
          mvn -B dependency:copy-dependencies -DoutputDirectory=target/dependency
          cp target/reproductor-musica-*.jar target/dependency/

      - name: Build app image with jpackage
        shell: bash
        run: |
          MAIN_JAR=$(ls target/reproductor-musica-*.jar | xargs -n1 basename | head -1)
          jpackage \
            --type app-image \
            --name MusicPlayer \
            --app-version "${{ steps.version.outputs.value }}" \
            --vendor Avuuna \
            --input target/dependency \
            --main-jar "$MAIN_JAR" \
            --main-class avuuna.player.MainPlayer \
            --dest target/dist

      - name: Zip app image
        shell: pwsh
        run: Compress-Archive -Path target/dist/MusicPlayer -DestinationPath target/MusicPlayer-${{ steps.version.outputs.value }}.zip

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          awk -v v="$version" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" v "]") > 0) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          echo "----- release notes -----"
          cat release-notes.md
          echo "-------------------------"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/MusicPlayer-*.zip
          body_path: release-notes.md
